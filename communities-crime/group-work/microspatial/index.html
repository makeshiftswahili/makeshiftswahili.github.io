<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="SOCL4091 Microspatial Convergence Lab">
  <title>Microspatial Convergence Lab | SOCL4091</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#141414;color:#f5f5f5}
    .loading{min-height:100vh;display:grid;place-items:center;padding:2rem}
    .loading-card{max-width:42rem;border:1px solid #3a3a3a;background:#1d1d1d;padding:1.5rem}
    h1{margin:0 0 .5rem;font-size:1.5rem;font-weight:500}
    p{margin:.5rem 0 0;line-height:1.5;color:#b8b8b8}
    a{color:#2CA25F}
  </style>
</head>
<body>
  <main class="loading">
    <div class="loading-card">
      <h1>Loading Microspatial Convergence Lab…</h1>
      <p>If the activity does not appear automatically, <a href="../routine-collision/">open the fallback activity URL</a>.</p>
    </div>
  </main>
  <script>
    (async () => {
      try {
        const response = await fetch('../routine-collision/index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('Could not load activity shell');
        let html = await response.text();
        if (!/<base\s/i.test(html)) {
          html = html.replace(/<head([^>]*)>/i, '<head$1><base href="../routine-collision/">');
        }
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error(error);
        document.querySelector('.loading-card').innerHTML = '<h1>Microspatial Convergence Lab</h1><p>The activity could not load automatically. Please use the <a href="../routine-collision/">fallback activity URL</a> and let the instructor know.</p>';
      }
    })();
  </script>
</body>
</html>
