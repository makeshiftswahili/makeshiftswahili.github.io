<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Spatial Analysis Lab</title>
  <link rel="stylesheet" href="https://use.typekit.net/pgi1nbm.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.3.0/turf.min.js"></script>
  <script src="../assets/core.js"></script>
  <script src="../assets/labs.js" defer></script>
</head>
<body data-lab="maup">
  <div id="app"></div>
  <noscript>This interactive lab requires JavaScript.</noscript>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const scale = document.getElementById('maup-scale');
        if (!scale) return;

        const label = document.querySelector('label[for="maup-scale"]');
        if (label) label.textContent = 'Aggregation factor';

        const optionLabels = {
          '1': 'Original scale (1 source cell per unit)',
          '2': '2×2 source cells per block',
          '4': '4×4 source cells per block',
          '8': '8×8 source cells per block'
        };
        Array.from(scale.options).forEach(option => {
          if (optionLabels[option.value]) option.textContent = optionLabels[option.value];
        });

        scale.value = '1';
        scale.dispatchEvent(new Event('change'));
      }, 0);
    });
  </script>
</body>
</html>
