name: Switch exported legends to header strips

on:
  push:
    paths:
      - tools/.export-legend-header-trigger
      - .github/workflows/switch-export-legends-to-header-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python tools/switch-export-legends-to-header.py

      - name: Bump first-party asset release
        run: python tools/bump-assets.py 20260822-1

      - name: Verify migration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CC_EXPORT_LEGEND.compose' communities-crime/social-disorganization/app.js
          grep -q 'CC_EXPORT_LEGEND.compose' communities-crime/political-economy/app.js
          grep -q 'CC_EXPORT_LEGEND.compose' communities-crime/segregation/app.js
          grep -q 'CC_EXPORT_LEGEND.compose' communities-crime/crime-analysis/app.js
          grep -q 'CC_EXPORT_LEGEND.compose' communities-crime/opportunity/document.js
          grep -q 'sdt-web-legends.js?v=20260822-1' communities-crime/social-disorganization/index.html
          grep -q 'export-legend-strip.js?v=20260822-1' communities-crime/social-disorganization/index.html
          grep -q 'export-legend-strip.js?v=20260822-1' communities-crime/political-economy/index.html
          grep -q 'export-legend-strip.js?v=20260822-1' communities-crime/segregation/index.html
          grep -q 'export-legend-strip.js?v=20260822-1' communities-crime/crime-analysis/index.html
          grep -q 'export-legend-strip.js?v=20260822-1' communities-crime/opportunity/index.html
          ! grep -q 'legend-control-slot' communities-crime/social-disorganization/app.js
          ! grep -q 'legend-control-slot' communities-crime/political-economy/app.js
          ! grep -q 'legend-control-slot' communities-crime/segregation/app.js
          ! grep -q 'legend-control-slot' communities-crime/crime-analysis/index.html
          ! grep -q '<strong>Legend preview:</strong>' communities-crime/social-disorganization/index.html
          ! grep -q '<strong>Legend preview:</strong>' communities-crime/political-economy/index.html
          ! grep -q '<strong>Legend preview:</strong>' communities-crime/segregation/index.html
          ! grep -q '<strong>Legend preview:</strong>' communities-crime/crime-analysis/index.html

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add communities-crime
          git commit -m 'Move exported legends above maps'
          git push origin HEAD:main
