name: Validate map popup and HMDA fixes

on:
  push:
    paths:
      - '.github/workflows/apply-map-popup-fixes.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check JavaScript syntax
        run: |
          node --check communities-crime/political-economy/app.js
          node --check communities-crime/segregation/app.js
      - name: Verify expected changes
        run: |
          grep -q 'No data: 0 owner-occupied units' communities-crime/political-economy/app.js
          grep -q 'hmda-no-owner-hatch' communities-crime/political-economy/app.js
          grep -q 'closeOnClick:false' communities-crime/political-economy/app.js
          grep -q 'closeOnClick:false' communities-crime/segregation/app.js
          grep -q 'Explicit close control for interactive map popups' communities-crime/political-economy/styles.css
          grep -q 'Explicit close control for interactive map popups' communities-crime/segregation/styles.css
