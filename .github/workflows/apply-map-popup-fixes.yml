name: Apply map popup and HMDA fixes

on:
  push:
    paths:
      - '.github/workflows/apply-map-popup-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patches
        run: python .github/scripts/apply_map_fixes.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add communities-crime/political-economy communities-crime/segregation
          git diff --cached --check
          git commit -m "Improve map no-data symbology and popup controls"
          git push origin main
