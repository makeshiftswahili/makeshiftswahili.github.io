name: Apply map popup and HMDA fixes

on:
  push:
    paths:
      - '.github/workflows/apply-map-popup-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch map behavior
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          pe = Path('communities-crime/political-economy/app.js')
          s = pe.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Could not find expected {label} block')
              s = s.replace(old, new, 1)

          replace_once(
              'const HMDA_DATA_VERSION="20260816-hmda-alltracts";',
              'const HMDA_DATA_VERSION="20260816-hmda-alltracts-v2";',
              'HMDA cache version'
          )

          replace_once(
              'function hmdaBreaks(data){const v=sortedValues(data,"loanrate");let b=uniqueAscending([.2,.4,.6,.8].map(q=>quantile(v,q)));if(b.length<4)b=fallbackBreaks(v,4);return b.slice(0,4)}',
              'function hmdaBreaks(data){const v=data.features.filter(f=>num(f?.properties?.numownunits)>0).map(f=>num(f?.properties?.loanrate)).filter(v=>v!==null).sort((a,b)=>a-b);let b=uniqueAscending([.2,.4,.6,.8].map(q=>quantile(v,q)));if(b.length<4)b=fallbackBreaks(v,4);return b.slice(0,4)}',
              'HMDA breaks'
          )

          replace_once(
              'function hmdaLegendItems(){return[{c:palettes.hmda[0],t:"Very Low"},{c:palettes.hmda[1],t:"Low"},{c:palettes.hmda[2],t:"Moderate"},{c:palettes.hmda[3],t:"High"},{c:palettes.hmda[4],t:"Very High"}]}',
              'function hmdaLegendItems(){return[{c:palettes.hmda[0],t:"Very Low"},{c:palettes.hmda[1],t:"Low"},{c:palettes.hmda[2],t:"Moderate"},{c:palettes.hmda[3],t:"High"},{c:palettes.hmda[4],t:"Very High"},{c:"#ffffff",pattern:true,t:"No data: 0 owner-occupied units"}]}',
              'HMDA legend items'
          )

          replace_once(
              'function legendHtml(title,items,note=""){return `<span class="legend-title">${title}</span>${items.map(i=>`<span class="legend-item"><span class="legend-swatch" style="background:${i.c}"></span><span>${i.t}</span></span>`).join("")}${note?`<span class="legend-note">${note}</span>`:""}`}',
              'function legendHtml(title,items,note=""){return `<span class="legend-title">${title}</span>${items.map(i=>`<span class="legend-item"><span class="legend-swatch" style="${i.pattern?"background:repeating-linear-gradient(135deg,#fff 0,#fff 4px,#111 4px,#111 6px)":`background:${i.c}`}\"></span><span>${i.t}</span></span>`).join("")}${note?`<span class="legend-note">${note}</span>`:""}`}',
              'legend HTML'
          )

          old_popup = 'function popupHtml(type,p){if(type==="renter")return `<div class="value-popup"><strong>Block group ${p.GEOID10||p.bgidfp10||""}</strong><dl><dt>Percent renter</dt><dd>${fmt(p.prenter)}</dd><dt>2012–2016 pooled annual eviction rate</dt><dd>${fmt(p.evictrate,2)}</dd></dl><small>Use renter share as context when interpreting zero or very low eviction rates.</small></div>`;if(type==="eviction")return `<div class="value-popup"><strong>Block group ${p.GEOID10||p.bgidfp10||""}</strong><dl><dt>2012–2016 pooled annual eviction rate</dt><dd>${fmt(p.evictrate,2)}</dd><dt>Percent renter</dt><dd>${fmt(p.prenter)}</dd><dt>Eviction filing rate</dt><dd>${fmt(p.filerate,2)}</dd></dl></div>`;return `<div class="value-popup"><strong>Tract ${p.GEOID10||p.trctidfp10||""}</strong><dl><dt>Relative mortgage investment</dt><dd>${hmdaCategory(p.loanrate,classInfo.hmda)}</dd></dl></div>`}'
          new_popup = 'function popupHtml(type,p){if(type==="renter")return `<div class="value-popup"><strong>Block group ${p.GEOID10||p.bgidfp10||""}</strong><dl><dt>Percent renter</dt><dd>${fmt(p.prenter)}</dd><dt>2012–2016 pooled annual eviction rate</dt><dd>${fmt(p.evictrate,2)}</dd></dl><small>Use renter share as context when interpreting zero or very low eviction rates.</small></div>`;if(type==="eviction")return `<div class="value-popup"><strong>Block group ${p.GEOID10||p.bgidfp10||""}</strong><dl><dt>2012–2016 pooled annual eviction rate</dt><dd>${fmt(p.evictrate,2)}</dd><dt>Percent renter</dt><dd>${fmt(p.prenter)}</dd><dt>Eviction filing rate</dt><dd>${fmt(p.filerate,2)}</dd></dl></div>`;if(num(p.numownunits)===0)return `<div class="value-popup"><strong>Tract ${p.GEOID10||p.trctidfp10||""}</strong><dl><dt>Relative mortgage investment</dt><dd>No data</dd><dt>Owner-occupied units (2020)</dt><dd>0</dd></dl><small>No mortgage-investment rate can be calculated because the tract has 0 owner-occupied housing units.</small></div>`;return `<div class="value-popup"><strong>Tract ${p.GEOID10||p.trctidfp10||""}</strong><dl><dt>Relative mortgage investment</dt><dd>${hmdaCategory(p.loanrate,classInfo.hmda)}</dd></dl></div>`}'
          replace_once(old_popup, new_popup, 'popup HTML')

          replace_once(
              'function addPopup(map,layerId,type){map.on("mouseenter",layerId,()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave",layerId,()=>map.getCanvas().style.cursor="");map.on("click",layerId,e=>{const f=e.features?.[0];if(!f)return;new maplibregl.Popup({closeButton:true,maxWidth:"300px"}).setLngLat(e.lngLat).setHTML(popupHtml(type,f.properties||{})).addTo(map)})}',
              'function addPopup(map,layerId,type){let activePopup=null,activeId=null;map.on("mouseenter",layerId,()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave",layerId,()=>map.getCanvas().style.cursor="");map.on("click",layerId,e=>{const f=e.features?.[0];if(!f)return;const p=f.properties||{},id=String(p.GEOID10||p.bgidfp10||p.trctidfp10||"");if(activePopup&&id===activeId){activePopup.remove();activePopup=null;activeId=null;return}if(activePopup)activePopup.remove();activeId=id;activePopup=new maplibregl.Popup({closeButton:true,closeOnClick:false,maxWidth:"300px"}).setLngLat(e.lngLat).setHTML(popupHtml(type,p)).addTo(map);activePopup.on("close",()=>{activePopup=null;activeId=null})})}',
              'popup interaction'
          )

          old_layer = 'function addThematicLayer(map,data,type,breaks){map.addSource("thematic",{type:"geojson",data});let color;if(type==="renter")color=renterExpression();else if(type==="eviction")color=evictionExpression(breaks);else color=hmdaExpression(breaks);map.addLayer({id:"thematic-fill",type:"fill",source:"thematic",paint:{"fill-color":color,"fill-opacity":1}});map.addLayer({id:"thematic-line",type:"line",source:"thematic",paint:{"line-color":"#777777","line-width":.6,"line-opacity":.72}});addPopup(map,"thematic-fill",type)}'
          new_layer = 'function ensureNoOwnerPattern(map){if(map.hasImage("no-owner-hatch"))return;const size=12,canvas=document.createElement("canvas");canvas.width=size;canvas.height=size;const ctx=canvas.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,size,size);ctx.strokeStyle="#111111";ctx.lineWidth=1.6;for(let off=-size;off<size*2;off+=6){ctx.beginPath();ctx.moveTo(off,size);ctx.lineTo(off+size,0);ctx.stroke()}map.addImage("no-owner-hatch",ctx.getImageData(0,0,size,size),{pixelRatio:1})}\nfunction addThematicLayer(map,data,type,breaks){map.addSource("thematic",{type:"geojson",data});let color;if(type==="renter")color=renterExpression();else if(type==="eviction")color=evictionExpression(breaks);else color=hmdaExpression(breaks);map.addLayer({id:"thematic-fill",type:"fill",source:"thematic",paint:{"fill-color":color,"fill-opacity":1}});if(type==="hmda"){ensureNoOwnerPattern(map);map.addLayer({id:"hmda-no-owner-hatch",type:"fill",source:"thematic",filter:["==",["to-number",["get","numownunits"],-1],0],paint:{"fill-pattern":"no-owner-hatch","fill-opacity":1}})}map.addLayer({id:"thematic-line",type:"line",source:"thematic",paint:{"line-color":"#777777","line-width":.6,"line-opacity":.72}});addPopup(map,"thematic-fill",type)}'
          replace_once(old_layer, new_layer, 'thematic layer')

          replace_once(
              '"City-specific quintiles of 2018–2021 mortgage originations per 1,000 owner-occupied housing units (2020); the same breaks are used for both neighborhoods."',
              '"City-specific quintiles of 2018–2021 mortgage originations per 1,000 owner-occupied housing units (2020); the same breaks are used for both neighborhoods. Hatched tracts have 0 owner-occupied units and no calculable rate."',
              'live HMDA legend note'
          )

          replace_once(
              'return{title:"Mortgage investment, 2018–2021",items:hmdaLegendItems(classInfo.hmda),note:"City-specific quintiles (Very Low–Very High)."}',
              'return{title:"Mortgage investment, 2018–2021",items:hmdaLegendItems(classInfo.hmda),note:"City-specific quintiles; hatched = 0 owner-occupied units."}',
              'export HMDA legend note'
          )

          helper = 'function drawExportSwatch(ctx,x,y,sw,s,item){ctx.save();ctx.fillStyle=item.c||"#ffffff";ctx.fillRect(x,y,sw,sw);if(item.pattern){ctx.beginPath();ctx.rect(x,y,sw,sw);ctx.clip();ctx.strokeStyle="#111111";ctx.lineWidth=Math.max(1,1.3*s);for(let off=-sw;off<sw*2;off+=5*s){ctx.beginPath();ctx.moveTo(x+off,y+sw);ctx.lineTo(x+off+sw,y);ctx.stroke()}}ctx.restore();ctx.strokeStyle="#777";ctx.lineWidth=1*s;ctx.strokeRect(x+.5*s,y+.5*s,sw-1*s,sw-1*s)}\n'
          marker = 'function drawExportLegend(ctx,canvas,info,scale)'
          if marker not in s:
              raise SystemExit('Could not find export legend function')
          s = s.replace(marker, helper + marker, 1)
          replace_once(
              'ctx.fillStyle=item.c;ctx.fillRect(x+pad,yy-sw+2*s,sw,sw);ctx.strokeStyle="#777";ctx.lineWidth=1*s;ctx.strokeRect(x+pad+.5*s,yy-sw+2.5*s,sw-1*s,sw-1*s);',
              'drawExportSwatch(ctx,x+pad,yy-sw+2*s,sw,s,item);',
              'export legend swatch'
          )

          pe.write_text(s)

          # Add same-feature toggle behavior to segregation popups.
          seg = Path('communities-crime/segregation/app.js')
          t = seg.read_text()
          old = '''function addRacePopup(map,key){
 map.on("mouseenter","race-fill",()=>{if(!drawStates[key]?.mode)map.getCanvas().style.cursor="pointer"});
 map.on("mouseleave","race-fill",()=>{if(!drawStates[key]?.mode)map.getCanvas().style.cursor=""});
 map.on("click","race-fill",e=>{
   if(drawStates[key]?.mode)return;
   const f=e.features?.[0];if(!f)return;
   new maplibregl.Popup({closeButton:true,maxWidth:"300px"}).setLngLat(e.lngLat).setHTML(popupHtml(f.properties||{})).addTo(map);
 });
}'''
          new = '''function addRacePopup(map,key){
 let activePopup=null,activeId=null;
 map.on("mouseenter","race-fill",()=>{if(!drawStates[key]?.mode)map.getCanvas().style.cursor="pointer"});
 map.on("mouseleave","race-fill",()=>{if(!drawStates[key]?.mode)map.getCanvas().style.cursor=""});
 map.on("click","race-fill",e=>{
   if(drawStates[key]?.mode)return;
   const f=e.features?.[0];if(!f)return;
   const p=f.properties||{},id=String(p.GEOID10||p.bgidfp10||"");
   if(activePopup&&id===activeId){activePopup.remove();activePopup=null;activeId=null;return}
   if(activePopup)activePopup.remove();
   activeId=id;
   activePopup=new maplibregl.Popup({closeButton:true,closeOnClick:false,maxWidth:"300px"}).setLngLat(e.lngLat).setHTML(popupHtml(p)).addTo(map);
   activePopup.on("close",()=>{activePopup=null;activeId=null});
 });
}'''
          if old not in t:
              raise SystemExit('Could not find segregation popup block')
          seg.write_text(t.replace(old,new,1))

          # Make MapLibre popup close buttons explicit anywhere a Communities & Crime module uses popups.
          close_css = '\n/* Explicit close control for interactive map popups. */\n.maplibregl-popup-close-button{display:block!important;position:absolute!important;right:2px!important;top:2px!important;width:26px!important;height:26px!important;padding:0!important;border:0!important;border-radius:2px!important;background:transparent!important;color:#333!important;font:700 20px/24px Arial,sans-serif!important;cursor:pointer!important;z-index:2!important}.maplibregl-popup-close-button:hover{background:#ececec!important;color:#111!important}\n'
          for js in Path('communities-crime').rglob('*.js'):
              text = js.read_text(errors='ignore')
              if 'new maplibregl.Popup' not in text:
                  continue
              css = js.parent / 'styles.css'
              if css.exists() and 'Explicit close control for interactive map popups.' not in css.read_text(errors='ignore'):
                  css.write_text(css.read_text() + close_css)

          # Explain the hatched no-data tracts and bust the module JS cache.
          idx = Path('communities-crime/political-economy/index.html')
          h = idx.read_text()
          old_instr = 'These are relative positions within your city, not absolute thresholds, and the same class breaks are used for both neighborhoods.</p>'
          new_instr = 'These are relative positions within your city, not absolute thresholds, and the same class breaks are used for both neighborhoods. Tracts shown with black diagonal hatching have 0 owner-occupied housing units in 2020, so a mortgage-investment rate cannot be calculated.</p>'
          if old_instr not in h:
              raise SystemExit('Could not find HMDA instructions in index')
          h = h.replace(old_instr,new_instr,1)
          h = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260816-pe6', h, count=1)
          idx.write_text(h)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add communities-crime/political-economy communities-crime/segregation
          git diff --cached --check
          git commit -m "Improve map no-data symbology and popup controls"
          git push origin main
