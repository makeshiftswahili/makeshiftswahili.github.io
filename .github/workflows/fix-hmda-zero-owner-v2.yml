name: Fix HMDA zero-owner tract rendering

on:
  push:
    paths:
      - '.github/workflows/fix-hmda-zero-owner-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/fix_hmda_zero_owner_v2.py
      - name: Validate JavaScript
        run: node --check communities-crime/political-economy/app.js
      - name: Verify corrected no-data handling
        shell: bash
        run: |
          grep -Fq 'pe_denials_${slug}.geojson' communities-crime/political-economy/app.js
          grep -Fq '_noOwner:true' communities-crime/political-economy/app.js
          grep -Fq 'app.js?v=20260816-pe8' communities-crime/political-economy/index.html
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-hmda-zero-owner-v2.yml
          rm .github/workflows/inspect-hmda-schema.yml
          rm .github/workflows/fix-hmda-hatch-source.yml 2>/dev/null || true
          rm .github/scripts/fix_hmda_zero_owner_v2.py
          git add communities-crime/political-economy/app.js communities-crime/political-economy/index.html
          git add -u .github/workflows .github/scripts
          git diff --cached --check
          git commit -m 'Fix HMDA zero-owner tract hatching'
          git push origin main
