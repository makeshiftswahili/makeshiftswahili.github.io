name: Finalize exact legend preview release

on:
  push:
    paths:
      - tools/.finalize-legend-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/finalize-legend-preview-release.py
      - run: python tools/bump-assets.py 20260821-10
      - name: Commit final release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add communities-crime
          git commit -m 'Finalize exact legend preview release'
          git push origin HEAD:main
