name: Inspect HMDA GeoJSON coverage

on:
  push:
    paths:
      - '.github/workflows/inspect-hmda-schema.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare HMDA files to archived tract coverage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          base=Path('communities-crime/data')
          for hp in sorted(base.glob('pe_hmda_*.geojson')):
              slug=hp.stem.replace('pe_hmda_','')
              dp=base/f'pe_denials_{slug}.geojson'
              h=json.loads(hp.read_text())
              d=json.loads(dp.read_text())
              def gid(f):
                  p=f.get('properties') or {}
                  return str(p.get('GEOID10') or p.get('trctidfp10') or '')
              hi={gid(f) for f in h.get('features',[]) if gid(f)}
              di={gid(f) for f in d.get('features',[]) if gid(f)}
              absent=sorted(di-hi)
              extra=sorted(hi-di)
              print(f'{slug}: hmda={len(hi)} scaffold={len(di)} absent_from_hmda={len(absent)} extra={len(extra)}')
              print('  absent IDs:', ','.join(absent))
              print('  extra IDs:', ','.join(extra))
          PY
