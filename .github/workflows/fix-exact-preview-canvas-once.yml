name: Fix exact legend preview canvas cloning

on:
  push:
    paths:
      - tools/.exact-preview-trigger

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/fix-exact-preview-canvas.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add communities-crime
          git commit -m 'Preserve exact legend preview rendering'
          git push origin HEAD:main
