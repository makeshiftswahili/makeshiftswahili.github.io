name: Add Opportunity legend previews

on:
  push:
    paths:
      - tools/add-opportunity-legend-preview.py

permissions:
  contents: write

jobs:
  patch-opportunity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Opportunity legend previews
        run: python tools/add-opportunity-legend-preview.py

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'oppDocRegisterLegendPreviews' communities-crime/opportunity/document.js
          grep -q 'CC_LEGEND_PREVIEW?.getScale(key)' communities-crime/opportunity/document.js
          grep -q 'document.js?v=20260821-8' communities-crime/opportunity/index.html

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add communities-crime/opportunity
          git commit -m 'Add legend previews to all Opportunity maps'
          git push origin HEAD:main
