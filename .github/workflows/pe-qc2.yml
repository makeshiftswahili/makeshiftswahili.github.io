name: Political Economy Rate QC

on:
  push:
    paths:
      - '.github/workflows/pe-qc2.yml'

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect fields and outliers
        run: |
          python - <<'PY'
          import json, os
          D='communities-crime/data'
          cities=['chicago','houston','losangeles','neworleans','philadelphia']
          for city in cities:
              p=f'{D}/pe_evict_{city}.geojson'
              with open(p,encoding='utf-8') as f:d=json.load(f)
              rows=[x.get('properties',{}) for x in d['features']]
              print('\nCITY',city)
              print('FIELDS', sorted(rows[0].keys()))
              bad=[]
              for r in rows:
                  try:e=float(r.get('evictrate'))
                  except:continue
                  if e>=20:bad.append((e,{k:r.get(k) for k in r if any(s in k.lower() for s in ['rent','evic','fil','pop','house','hh'])}))
              print('N_RATE_GE20',len(bad))
              for x in sorted(bad,reverse=True,key=lambda z:z[0])[:8]: print('OUTLIER',x)
          for city in ['atlanta','neworleans']:
              p=f'{D}/pe_hmda_{city}.geojson'
              with open(p,encoding='utf-8') as f:d=json.load(f)
              rows=[x.get('properties',{}) for x in d['features']]
              print('\nHMDA',city,'FIELDS',sorted(rows[0].keys()))
              vals=[]
              for r in rows:
                  try:v=float(r.get('pdenied'))
                  except:continue
                  if v>=10: vals.append((v,{k:r.get(k) for k in r if any(s in k.lower() for s in ['deny','loan','app','mort','hmda','total','n'])}))
              print('HMDA_GE10',len(vals))
              for x in sorted(vals,reverse=True,key=lambda z:z[0])[:8]: print('HMDA_OUTLIER',x)
          PY
