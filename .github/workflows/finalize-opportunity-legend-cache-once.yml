name: Finalize Opportunity legend cache

on:
  push:
    paths:
      - tools/.opportunity-legend-cache-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/finalize-opportunity-legend-cache.py
      - run: python tools/bump-assets.py 20260821-11
      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add communities-crime
          git commit -m 'Finalize Opportunity legend preview cache'
          git push origin HEAD:main
