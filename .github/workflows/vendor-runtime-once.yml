name: Vendor Communities & Crime runtime libraries

on:
  pull_request:
    types: [opened]
    paths:
      - tools/vendorize-trigger.txt

permissions:
  contents: write

jobs:
  vendor-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download pinned runtime libraries
        run: bash tools/fetch-vendor-assets.sh

      - name: Replace runtime CDN references
        run: python tools/vendorize-communities-crime.py

      - name: Standardize first-party cache-busting token
        run: python tools/bump-assets.py 20260821-5

      - name: Verify vendored files and references
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/leaflet/leaflet.js
          test -s vendor/leaflet/leaflet.css
          test -s vendor/leaflet/images/marker-icon.png
          test -s vendor/esri-leaflet/esri-leaflet.js
          test -s vendor/turf/turf.min.js
          test -s vendor/maplibre/maplibre-gl.js
          test -s vendor/maplibre/maplibre-gl.css
          test -s vendor/jspdf/jspdf.umd.min.js
          if grep -R -nE 'unpkg\.com|cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com' communities-crime --include='*.html' --include='*.js' --include='*.css'; then
            echo 'Unexpected runtime CDN reference remains under communities-crime/' >&2
            exit 1
          fi

      - name: Commit vendored dependencies and HTML updates to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor communities-crime
          git commit -m 'Vendor course runtime libraries and normalize cache busting'
          git push origin "HEAD:${HEAD_REF}"
