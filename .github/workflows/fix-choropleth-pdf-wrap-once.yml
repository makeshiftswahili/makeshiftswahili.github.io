name: Fix choropleth PDF wrapping

on:
  push:
    paths:
      - tools/.choropleth-pdf-wrap-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/fix-choropleth-pdf-wrap.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check communities-crime/group-work/choropleth-interpretation/pdf-fix.js
          grep -q '__ccChoroplethPdfWrapFix' communities-crime/group-work/choropleth-interpretation/pdf-fix.js
          grep -q 'pdf-fix.js?v=20260825-1' communities-crime/group-work/choropleth-interpretation/index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add communities-crime/group-work/choropleth-interpretation
          git commit -m 'Fix choropleth PDF description wrapping'
          git push origin HEAD:main
