name: Upgrade assignment map controls

on:
  pull_request:
    types: [opened]
    paths:
      - tools/legend-preview-upgrade.py
      - tools/legend-preview-trigger.txt

permissions:
  contents: write

jobs:
  upgrade-map-controls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply legend preview upgrade
        run: python tools/legend-preview-upgrade.py

      - name: Verify map controls
        shell: bash
        run: |
          set -euo pipefail
          for dir in neighborhood-description social-disorganization political-economy segregation crime-analysis; do
            if grep -R -nE 'Download PNG|download-map|downloadFigure' "communities-crime/$dir" --include='*.html' --include='*.js'; then
              echo "Legacy PNG-download control remains in $dir" >&2
              exit 1
            fi
          done
          for page in social-disorganization political-economy segregation crime-analysis; do
            grep -q 'legend-preview.js?v=20260821-7' "communities-crime/$page/index.html"
          done
          grep -q 'CC_LEGEND_PREVIEW' communities-crime/social-disorganization/app.js
          grep -q 'CC_LEGEND_PREVIEW' communities-crime/political-economy/app.js
          grep -q 'CC_LEGEND_PREVIEW' communities-crime/segregation/app.js
          grep -q 'CC_LEGEND_PREVIEW' communities-crime/crime-analysis/app.js

      - name: Commit upgrade to PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add communities-crime
          git commit -m 'Replace PNG downloads with legend preview controls'
          git push origin "HEAD:${HEAD_REF}"
