name: Fix legend preview and map attribution

on:
  push:
    paths:
      - tools/fix-legend-preview-attribution.py

permissions:
  contents: write

jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/fix-legend-preview-attribution.py

      - name: Bump first-party asset release
        run: python tools/bump-assets.py 20260821-9

      - name: Verify key changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rerenderOnScale' communities-crime/legend-preview.js
          grep -q 'installOffMapAttribution' communities-crime/dark-basemap.js
          grep -q 'sdtLegendPreviewNode' communities-crime/social-disorganization/app.js
          grep -q 'renderExportLegendPreview' communities-crime/political-economy/app.js
          grep -q 'renderExportLegendPreview' communities-crime/segregation/app.js
          grep -q 'renderRateLegendPreview' communities-crime/crime-analysis/app.js
          grep -q 'oppDocRenderLegendPreview' communities-crime/opportunity/document.js
          ! grep -q 'const label="© OpenStreetMap contributors"' communities-crime/social-disorganization/app.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add communities-crime
          git commit -m 'Match legend previews to exported maps'
          git push origin HEAD:main
