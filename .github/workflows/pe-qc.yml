name: Political Economy Data QC

on:
  push:
    paths:
      - '.github/workflows/pe-qc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize political economy data
        shell: bash
        run: |
          python - <<'PY'
          import json, glob, math, os, statistics

          DATA='communities-crime/data'
          cities=['atlanta','chicago','denver','detroit','houston','losangeles','milwaukee','neworleans','philadelphia','sanfrancisco','seattle']

          def val(x):
              if x is None or x=='': return None
              try:
                  y=float(x)
                  return y if math.isfinite(y) else None
              except: return None

          def quantile(a,p):
              if not a: return None
              a=sorted(a); pos=(len(a)-1)*p; lo=int(math.floor(pos)); hi=min(lo+1,len(a)-1); r=pos-lo
              return a[lo]+r*(a[hi]-a[lo])

          def f(x):
              return 'NA' if x is None else f'{x:.2f}'

          print('=== EVICTION QC ===')
          print('city|n|zero%|<=1%|<=2%|pos_p25|pos_med|pos_p75|pos_p90|pos_max|filing_zero%|filing_med|zeroEv_renter>=40%')
          for city in cities:
              path=f'{DATA}/pe_evict_{city}.geojson'
              if not os.path.exists(path):
                  print(f'{city}|MISSING')
                  continue
              with open(path,encoding='utf-8') as fh: d=json.load(fh)
              rows=[x.get('properties',{}) for x in d.get('features',[])]
              ev=[val(r.get('evictrate')) for r in rows]; ev=[x for x in ev if x is not None]
              pos=[x for x in ev if x>0]; zeros=sum(x==0 for x in ev)
              fil=[val(r.get('filerate')) for r in rows]; fil=[x for x in fil if x is not None]
              fzero=sum(x==0 for x in fil)
              zrent=[val(r.get('prenter')) for r in rows if val(r.get('evictrate'))==0]; zrent=[x for x in zrent if x is not None]
              fields=[city,str(len(ev)),f(100*zeros/len(ev) if ev else None),f(100*sum(x<=1 for x in ev)/len(ev) if ev else None),f(100*sum(x<=2 for x in ev)/len(ev) if ev else None),f(quantile(pos,.25)),f(quantile(pos,.5)),f(quantile(pos,.75)),f(quantile(pos,.9)),f(max(pos) if pos else None),f(100*fzero/len(fil) if fil else None),f(quantile(fil,.5)),f(100*sum(x>=40 for x in zrent)/len(zrent) if zrent else None)]
              print('|'.join(fields))

          print('\n=== HMDA QC ===')
          print('city|n|mean|p20|median|p80|p90|max|p80-p20|<=10%|<=15%|<=20%')
          for city in cities:
              path=f'{DATA}/pe_hmda_{city}.geojson'
              if not os.path.exists(path):
                  print(f'{city}|MISSING')
                  continue
              with open(path,encoding='utf-8') as fh: d=json.load(fh)
              v=[val(x.get('properties',{}).get('pdenied')) for x in d.get('features',[])]; v=[x for x in v if x is not None]
              p20=quantile(v,.2); p80=quantile(v,.8)
              fields=[city,str(len(v)),f(statistics.fmean(v) if v else None),f(p20),f(quantile(v,.5)),f(p80),f(quantile(v,.9)),f(max(v) if v else None),f((p80-p20) if p20 is not None and p80 is not None else None),f(100*sum(x<=10 for x in v)/len(v) if v else None),f(100*sum(x<=15 for x in v)/len(v) if v else None),f(100*sum(x<=20 for x in v)/len(v) if v else None)]
              print('|'.join(fields))
          PY
